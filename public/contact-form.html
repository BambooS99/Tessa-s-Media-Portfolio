<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Contact form</title></head>
  <body>
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact" />
      <p><label>Name <input name="name" type="text" required /></label></p>
      <p><label>Email <input name="email" type="email" required /></label></p>
      <p><label>What are you here to see more of? <input name="occasion" type="text" /></label></p>
      <p><label>Message <textarea name="message" required></textarea></label></p>
      <p><label>Don't fill this out if you're human: <input name="bot-field" /></label></p>
    </form>
  </body>
</html>
